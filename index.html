<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vũ & Trà</title>
  <style>
    body { margin:0; background: linear-gradient(#FF69B4, #9B59B6); color:#fff; font-family:Arial; }
    #app { text-align:center; padding-top:50px; }
    .characters { display:flex; justify-content:space-evenly; align-items:center; margin:40px 0; }
    .avatar { text-align:center; }
    .avatar img { width:160px; height:160px; border-radius:50%; border:5px solid white; box-shadow:0 0 20px rgba(255,255,255,0.5); }
    .heart { font-size:120px; margin:0 20px; }
    .btn-container { display:flex; gap:30px; justify-content:center; }
    .btn {
      width:140px; height:140px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-size:22px; font-weight:bold; color:white; text-shadow:2px 2px 5px rgba(0,0,0,0.5); cursor:pointer;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }
    #btn1 { background:#FF69B4; }
    #btn2 { background:#FF4500; }
    #btn3 { background:#9B59B6; }
    .action { margin-top:30px; font-size:20px; padding:15px 30px; background:rgba(255,255,255,0.2); border-radius:15px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Vũ Hoàng & Trà</h1>
    
    <div class="characters">
      <div class="avatar">
        <img id="vuhuong" src="https://i.imgur.com/6vK8vL5.png" alt="Vũ Hoàng">
        <p>Vũ Hoàng</p>
      </div>
      <div class="heart">❤️</div>
      <div class="avatar">
        <img id="tra" src="https://i.imgur.com/9pX3wL6.png" alt="Trà">
        <p>Trà</p>
      </div>
    </div>

    <div class="btn-container">
      <div id="btn1" class="btn" onclick="action(1)">
        <span style="font-size:65px;">👋</span>
        <p>Vuốt má</p>
      </div>
      <div id="btn2" class="btn" onclick="action(2)">
        <span style="font-size:65px;">🤗</span>
        <p>Ôm</p>
      </div>
      <div id="btn3" class="btn" onclick="action(3)">
        <span style="font-size:65px;">💋</span>
        <p>Hôn</p>
      </div>
    </div>

    <div class="action" id="message"></div>
  </div>

  <script>
    function action(type) {
      let msg = document.getElementById('message');
      if (type === 1) msg.innerHTML = 'Vũ Hoàng vuốt má Trà! 😊';
      else if (type === 2) msg.innerHTML = 'Vũ Hoàng ôm Trà! 💕';
      else if (type === 3) msg.innerHTML = 'Vũ Hoàng hôn Trà! 💋';
      msg.style.color = '#fff';
      msg.style.fontWeight = 'bold';
      msg.style.transition = 'all 0.3s';
      const btns = document.querySelectorAll('.btn');
      btns[type-1].style.transform = 'scale(0.95)';
      setTimeout(() => btns[type-1].style.transform = 'scale(1)', 150);
    }
  </script>
</body>
</html>
