<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CapMoney">
<meta name="theme-color" content="#6366F1">
<title>CapMoney</title>
<style>
:root{--primary:#6366F1;--primary-grad:linear-gradient(135deg,#6366F1,#A78BFA);--bg:#F2F3F7;--card:#FFF;--text:#111318;--text2:#8A8F9C;--text3:#B4B9C4;--line:#E9EBF1;--green:#12B76A;--red:#F04438;--tabbg:rgba(255,255,255,.9);--shadow:0 2px 12px rgba(20,20,40,.06)}
[data-theme="dark"]{--bg:#0B0C10;--card:#16181F;--text:#F5F6FA;--text2:#8A8F9C;--text3:#5A6070;--line:#242733;--tabbg:rgba(22,24,31,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;background:var(--bg)}
body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
#app{position:relative;width:100%;max-width:520px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 100px}
#main.profile-mode{padding:0;display:flex;align-items:center;justify-content:center}
.hero{padding:14px 4px 8px;display:flex;align-items:center;gap:12px}
.hero-txt{flex:1;min-width:0}
.hero-greet{font-size:12px;color:var(--text2);font-weight:600}
.hero-name{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--green);font-weight:650;margin-top:6px;background:rgba(18,183,106,.12);padding:3px 8px;border-radius:8px}
.hero-avatar{width:48px;height:48px;border-radius:50%;background:var(--primary-grad);display:grid;place-items:center;font-size:24px;color:#fff;flex:0 0 auto;box-shadow:0 4px 12px rgba(0,0,0,.12);border:none}
.top-row{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.top-chip{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);flex:0 0 auto}
.top-chip .tc-ico{font-size:14px;opacity:.7}
.top-chip .tc-lbl{font-size:9.5px;color:var(--text2);font-weight:650}
.top-chip .tc-val{font-size:12.5px;font-weight:800;margin-top:2px}
.view-toggle{display:flex;gap:6px;margin-top:14px;align-items:center}
.view-toggle button{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;color:var(--text2);background:var(--bg);display:flex;align-items:center;gap:6px}
.view-toggle button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.vt-badge{background:var(--primary);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:8px;min-width:20px;text-align:center}
.vt-icons{margin-left:auto;display:flex;gap:8px}
.vt-icon-btn{width:34px;height:34px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--text2);font-size:15px;border:none}
.vt-icon-btn.active{background:var(--primary);color:#fff}
.summary-2{display:flex;gap:8px;margin-top:14px}
.sum-c{flex:1;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);position:relative}
.sum-c .sc-ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;margin-bottom:8px}
.sum-c.inc .sc-ico{background:rgba(18,183,106,.15);color:var(--green)}
.sum-c.exp .sc-ico{background:rgba(240,68,56,.15);color:var(--red)}
.sum-c .sc-val{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-c.inc .sc-val{color:var(--green)}
.sum-c .sc-lbl{font-size:10.5px;color:var(--text2);font-weight:650;margin-top:2px}
.sc-eye{position:absolute;right:12px;bottom:12px;color:var(--text3);font-size:15px;width:22px;height:22px;display:grid;place-items:center;border:none;background:none}
.chips{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:12px;background:var(--bg);font-size:12px;font-weight:650;color:var(--text2);display:flex;align-items:center;gap:5px;border:none}
.chip.active{background:var(--primary);color:#fff}
.cal-card{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px}
.cal-nav .cn-btn{width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:15px;color:var(--text2);border:none}
.cal-nav .cn-label{font-size:14.5px;font-weight:750}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding-bottom:8px}
.cal-head div{text-align:center;font-size:10.5px;color:var(--text3);font-weight:700;padding:4px 0}
.cal-head div.cn{color:var(--red)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:12px;font-weight:650;color:var(--text);padding:2px;cursor:pointer}
.cal-cell.other{color:var(--text3);opacity:.5}
.cal-cell.today{background:var(--primary);color:#fff}
.cal-cell.selected{background:rgba(99,102,241,.15);color:var(--primary)}
.cal-cell.has-tx::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--primary)}
.cal-cell.today.has-tx::after{background:#fff}
.cal-thumbs{position:absolute;top:1px;right:2px;display:flex;gap:1px}
.cal-thumbs img{width:14px;height:14px;border-radius:4px;object-fit:cover;border:1.5px solid var(--card)}
.cal-cell.today .cal-thumbs img{border-color:var(--primary)}
.cal-plus{width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--text3);display:grid;place-items:center;font-size:14px;font-weight:700;margin:0 auto}
.day-sum{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-top:12px;display:flex;align-items:center;gap:12px}
.day-sum .ds-date{font-size:13px;font-weight:750}
.day-sum .ds-amt{margin-left:auto;text-align:right}
.day-sum .ds-row{font-size:12px;font-weight:700;display:flex;gap:10px;justify-content:flex-end;margin-top:2px}
.day-sum .ds-row .r{color:var(--red)}
.day-sum .ds-row .g{color:var(--green)}
.tx{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--card);border-radius:16px;margin-top:8px;box-shadow:var(--shadow);cursor:pointer}
.tx:active{transform:scale(.98)}
.tx-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;overflow:hidden}
.tx-ic img{width:100%;height:100%;object-fit:cover}
.tx-bd{flex:1;min-width:0}
.tx-nm{font-size:14px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11.5px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-am{font-size:14px;font-weight:750;white-space:nowrap}
.tx-am.pos{color:var(--green)}
.photo-day-head{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 8px}
.photo-day-head .pd-date{font-size:13px;font-weight:750}
.photo-day-head .pd-sum{display:flex;gap:10px;font-size:12px;font-weight:700}
.photo-day-head .pd-sum .r{color:var(--red)}
.photo-day-head .pd-sum .g{color:var(--green)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-cell{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#000;cursor:pointer}
.photo-cell img{width:100%;height:100%;object-fit:cover;display:block}
.photo-cell .pc-tag{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;font-weight:700;padding:3px 6px;border-radius:6px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-cell .pc-amt{position:absolute;bottom:6px;left:6px;right:6px;font-size:11.5px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.photo-cell.more{background:var(--card);display:grid;place-items:center;color:var(--text2);font-size:13px;font-weight:750;box-shadow:var(--shadow)}
.empty{text-align:center;padding:44px 20px;color:var(--text2)}
.empty .ico{font-size:42px;margin-bottom:10px;opacity:.7}
.empty h3{margin:0 0 6px;font-size:15px;color:var(--text);font-weight:700}
.empty p{margin:0;font-size:12.5px;line-height:1.5}
#tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;z-index:30;display:flex;align-items:center;justify-content:space-around;background:var(--tabbg);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:650;color:var(--text3);width:52px;padding:6px 0;background:none;border:none}
.tab svg{width:22px;height:22px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--primary)}
.fab{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--primary-grad);color:#fff;transform:translateY(-14px);box-shadow:0 8px 20px rgba(99,102,241,.45);border:none}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.sheet{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,9,14,.5);animation:fade .18s}
.sheet-panel{width:100%;max-width:520px;max-height:94dvh;background:var(--card);border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.sheet-head .title{font-size:16px;font-weight:750}
.sheet-head button{font-size:14.5px;font-weight:650;color:var(--primary);padding:6px 4px;background:none;border:none}
.sheet-head button.muted{color:var(--text2)}
.sheet-body{flex:1;overflow-y:auto;padding:0 18px}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.seg{display:flex;background:var(--bg);border-radius:13px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--text2);background:none;border:none}
.seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.09)}
.seg button.active.exp{color:var(--red)}
.seg button.active.inc{color:var(--green)}
.amount-display{text-align:center;padding:6px 0 18px}
.amount-display .cur{font-size:14px;color:var(--text2);font-weight:600;margin-bottom:2px}
.amount-display .num{font-size:38px;font-weight:800;letter-spacing:-1.5px}
.amount-display .num.exp{color:var(--red)}
.amount-display .num.inc{color:var(--green)}
.amount-display .num.zero{color:var(--text3)}
.amount-display .num.shake{animation:shake .3s}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px}
.cat{flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;border-radius:15px;background:var(--bg);border:2px solid transparent}
.cat .ci{font-size:20px}
.cat .cn{font-size:10px;font-weight:650;color:var(--text2);text-align:center;line-height:1.15}
.cat.active{border-color:var(--primary);background:rgba(99,102,241,.1)}
.cat.active .cn{color:var(--primary)}
.field{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.field .fi{font-size:15px;opacity:.7}
.field input{flex:1;border:none;background:none;outline:none;font-size:14.5px;color:var(--text);font-weight:550;width:100%}
.field input::placeholder{color:var(--text3);font-weight:500}
.attach-row{display:flex;gap:10px;margin-bottom:10px}
.attach-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:14px;background:var(--bg);font-size:12.5px;font-weight:650;color:var(--text2);border:1.5px dashed transparent}
.attach-btn.has{border-color:var(--primary);background:rgba(99,102,241,.08);color:var(--primary)}
.attach-btn .ai{font-size:15px}
.photo-preview{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden;background:#000}
.photo-preview img{width:100%;max-height:220px;object-fit:cover;display:block}
.photo-preview button{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:15px;display:grid;place-items:center;border:none}
.loc-preview{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--bg);border-radius:14px;margin-bottom:10px;font-size:12.5px}
.loc-preview .lico{font-size:17px}
.loc-preview .ltext{flex:1;min-width:0}
.loc-preview .lname{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-preview .lcoord{font-size:10.5px;color:var(--text2);margin-top:2px}
.loc-preview button{width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--text2);font-size:13px;display:grid;place-items:center;flex:0 0 auto;border:none}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.numpad button{background:var(--card);padding:16px 0;font-size:21px;font-weight:600;color:var(--text);border:none}
.month-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 4px}
.month-nav button{width:34px;height:34px;border-radius:11px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);font-size:15px;color:var(--text2);border:none}
.month-nav .m-label{font-size:14.5px;font-weight:750;min-width:120px;text-align:center}
.summary-row{display:flex;gap:10px;margin-top:14px}
.sum-card{flex:1;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.sum-card .k{font-size:11px;color:var(--text2);font-weight:650;display:flex;align-items:center;gap:5px}
.sum-card .v{font-size:16px;font-weight:800;margin-top:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.donut-wrap{display:flex;justify-content:center;padding:18px 0 6px;position:relative}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.donut-center .dc-l{font-size:11px;color:var(--text2);font-weight:650}
.donut-center .dc-v{font-size:15px;font-weight:800;margin-top:2px}
.legend{margin-top:10px}
.leg{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--card);border-radius:14px;margin-bottom:7px;box-shadow:var(--shadow)}
.leg .li{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.leg .ln{flex:1;min-width:0}
.leg .lname{font-size:13px;font-weight:650}
.leg .lbar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.leg .lbar i{display:block;height:100%;border-radius:3px}
.leg .lv{text-align:right}
.leg .lv .a{font-size:13px;font-weight:750}
.leg .lv .p{font-size:10.5px;color:var(--text2);font-weight:600;margin-top:2px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:170px;padding:14px 4px 0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-top:6px}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.bar-pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bar{width:9px;border-radius:4px 4px 2px 2px;min-height:3px}
.bar.exp{background:linear-gradient(180deg,#F97066,#F04438)}
.bar.inc{background:linear-gradient(180deg,#32D583,#12B76A)}
.bar-lbl{font-size:10px;color:var(--text2);font-weight:650}
.chart-legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px;color:var(--text2);font-weight:650}
.chart-legend span{display:flex;align-items:center;gap:6px}
.set-group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.set-item{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none}
.set-item:last-child{border-bottom:none}
.set-item .si{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--bg);flex:0 0 auto}
.set-item .st{flex:1;min-width:0}
.set-item .st .a{font-size:14px;font-weight:650;color:var(--text)}
.set-item .st .b{font-size:11.5px;color:var(--text2);margin-top:2px}
.set-item .arrow{color:var(--text3);font-size:16px}
.set-item.danger .st .a{color:var(--red)}
select.mini{background:var(--bg);border:none;border-radius:9px;padding:7px 9px;font-size:12.5px;font-weight:650;color:var(--text);outline:none}
.color-row{display:flex;flex-wrap:wrap;gap:10px;padding:6px 0 10px}
.color-swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.color-swatch.active{border-color:var(--text);transform:scale(1.08)}
.color-custom{width:36px;height:36px;border-radius:50%;background:conic-gradient(from 0deg,#FF5C8A,#FF7A59,#EAB308,#22C55E,#0EA5E9,#6366F1,#A855F7,#FF5C8A);display:grid;place-items:center;color:#fff;font-size:13px}
#toastRoot{position:fixed;left:0;right:0;bottom:90px;z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#1C1D22;color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastIn .28s;pointer-events:auto;max-width:100%}
.toast button{color:#A5B4FC;font-weight:750;font-size:13px;background:none;border:none}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lightbox{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox button{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px;border:none}
.profile-screen{width:100%;min-height:100dvh;padding:40px 24px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--bg)}
.profile-logo{width:82px;height:82px;border-radius:26px;background:var(--primary-grad);display:grid;place-items:center;font-size:42px;color:#fff;margin:0 auto 18px;box-shadow:0 14px 30px rgba(99,102,241,.35)}
.profile-title{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:6px}
.profile-sub{font-size:13.5px;color:var(--text2);margin-bottom:30px;line-height:1.5}
.profile-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;max-width:360px;width:100%;margin-left:auto;margin-right:auto}
.profile-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);text-align:left;width:100%;border:none}
.profile-avatar{width:52px;height:52px;border-radius:50%;background:var(--primary-grad);display:grid;place-items:center;font-size:26px;color:#fff;flex:0 0 auto}
.profile-name{font-size:16px;font-weight:700;color:var(--text)}

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const CATS={
expense:[{id:'food',name:'Ăn uống',icon:'🍜',color:'#FF7A59'},{id:'drink',name:'Cà phê',icon:'☕️',color:'#B07C4F'},{id:'transport',name:'Di chuyển',icon:'🚕',color:'#4C9AFF'},{id:'shopping',name:'Mua sắm',icon:'🛍️',color:'#FF5C8A'},{id:'bill',name:'Hóa đơn',icon:'🧾',color:'#7C6BFF'},{id:'fun',name:'Giải trí',icon:'🎮',color:'#22C55E'},{id:'health',name:'Sức khỏe',icon:'💊',color:'#F43F5E'},{id:'edu',name:'Giáo dục',icon:'📚',color:'#0EA5E9'},{id:'home',name:'Nhà cửa',icon:'🏠',color:'#EAB308'},{id:'gift',name:'Quà tặng',icon:'🎁',color:'#EC4899'},{id:'other',name:'Khác',icon:'📦',color:'#94A3B8'}],
income:[{id:'salary',name:'Lương',icon:'💰',color:'#12B76A'},{id:'bonus',name:'Thưởng',icon:'🎉',color:'#F59E0B'},{id:'invest',name:'Đầu tư',icon:'📈',color:'#6366F1'},{id:'other_in',name:'Thu khác',icon:'💵',color:'#14B8A6'}]};
const catById=(t,id)=>CATS[t].find(c=>c.id===id)||{id:'other',name:'Khác',icon:'📦',color:'#94A3B8'};
const COLOR_PRESETS=['#6366F1','#0EA5E9','#12B76A','#F59E0B','#F04438','#EC4899','#A855F7','#14B8A6'];
const AVATARS=['👤','👨','👩','🧑','👨‍💻','👩‍💻','🦊','🐱','🐼','🦁','🌟','🚀','💎','🎯'];
const USERS_KEY='capmoney_users_v6';
const ACTIVE_KEY='capmoney_active_v6';
const HIDE_KEY='capmoney_hide_v6';

let allUsers=[],currentUser=null,state=null;
let tab='home';
let selDate=todayStr(),calDate=new Date();
let statsYM=(function(){const d=new Date();return{y:d.getFullYear(),m:d.getMonth()}})();
let statsViewMode='month',statsYear=new Date().getFullYear(),statsType='expense';
let photoFilter='all';
let hideAmounts=localStorage.getItem(HIDE_KEY)==='1';
let lastDeleted=null;

function save(){if(currentUser){currentUser.data=state;try{localStorage.setItem(USERS_KEY,JSON.stringify(allUsers))}catch(e){toast('Bộ nhớ đầy!')}}}
function saveHide(){localStorage.setItem(HIDE_KEY,hideAmounts?'1':'0')}
function loadUsers(){try{const raw=localStorage.getItem(USERS_KEY);if(raw){const p=JSON.parse(raw);if(Array.isArray(p))allUsers=p}const aid=localStorage.getItem(ACTIVE_KEY);if(aid){const u=allUsers.find(x=>x.id===aid);if(u){currentUser=u;state=u.data}}}catch(e){}}
function saveActive(){try{localStorage.setItem(ACTIVE_KEY,currentUser?currentUser.id:'')}catch(e){}}
function createUser(name,emoji){const u={id:uid(),name:name||'Người dùng',emoji:emoji||'👤',createdAt:Date.now(),data:{tx:[],budgets:{},totalBudget:0,settings:{theme:'auto',currency:'đ',primaryColor:'#6366F1'}}};allUsers.push(u);currentUser=u;state=u.data;saveActive();save();return u}
function switchUser(id){const u=allUsers.find(x=>x.id===id);if(!u)return;currentUser=u;state=u.data;saveActive();applyTheme();applyColor();render()}
function deleteUser(id){if(allUsers.length<=1){toast('Không thể xóa hồ sơ duy nhất');return}allUsers=allUsers.filter(u=>u.id!==id);if(currentUser&&currentUser.id===id){currentUser=allUsers[0];state=currentUser.data;saveActive()}save();applyTheme();applyColor();render()}

function fmtMoney(n){return new Intl.NumberFormat('vi-VN').format(Math.abs(Math.round(Number(n)||0)))}
function money(n,withCur){if(withCur===undefined)withCur=true;return fmtMoney(n)+(withCur?' '+state.settings.currency:'')}
function moneyH(n,withCur){if(withCur===undefined)withCur=true;if(hideAmounts)return'••••••';return money(n,withCur)}
function signed(n,t){return(t==='income'?'+':'−')+(hideAmounts?'••••':money(n))}
function shortMoney(n){if(hideAmounts)return'••••';const v=Math.abs(Number(n)||0);if(v>=1e9)return(v/1e9).toFixed(v%1e9===0?0:1).replace('.',',')+' tỷ';if(v>=1e6)return(v/1e6).toFixed(v%1e6===0?0:1).replace('.',',')+' tr';if(v>=1e3)return Math.round(v/1e3)+'k';return String(v)}
function dateLabel(ds){const d=new Date(ds+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);const diff=Math.round((t-d)/86400000);if(diff===0)return'Hôm nay';if(diff===1)return'Hôm qua';if(diff===2)return'Hôm trước';if(diff===3)return'3 ngày trước';return d.getDate()+' tháng '+(d.getMonth()+1)+', '+d.getFullYear()}
function greet(){const h=new Date().getHours();if(h<5)return{text:'Chúc ngủ ngon 🌙',status:'Đêm khuya rồi, nghỉ ngơi nhé'};if(h<11)return{text:'Chào buổi sáng ☀️',status:'Ngày mới tốt lành!'};if(h<13)return{text:'Chào buổi trưa 🌤️',status:'Ăn trưa ngon miệng nhé'};if(h<18)return{text:'Chào buổi chiều 🌇',status:'Cố lên, sắp hết ngày rồi'};if(h<22)return{text:'Chào buổi tối 🌆',status:'Tối nay ăn gì chưa?'};return{text:'Chúc ngủ ngon 🌙',status:'Ngủ ngon nhé!'}}
const ymOf=ds=>ds.slice(0,7);
const thisYM=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)};

function hexToRgb(hex){hex=String(hex).replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>Math.round(clamp(x,0,255)).toString(16).padStart(2,'0')).join('')}
function deriveGradient(p){const c=hexToRgb(p);const r=c[0],g=c[1],b=c[2];const l=function(a){return rgbToHex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a)};return'linear-gradient(135deg, '+p+' 0%, '+l(0.2)+' 100%)'}
function applyColor(){if(!state||!state.settings)return;const c=state.settings.primaryColor||'#6366F1';document.documentElement.style.setProperty('--primary',c);document.documentElement.style.setProperty('--primary-grad',deriveGradient(c));const meta=document.querySelector('meta[name="theme-color"]');const dark=document.documentElement.dataset.theme==='dark';if(meta)meta.content=dark?'#0B0C10':c}
function applyTheme(){if(!state||!state.settings)return;const t=state.settings.theme;const dark=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';applyColor()}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(state&&state.settings&&state.settings.theme==='auto')applyTheme()});

function toast(msg,actLbl,act){const root=$('#toastRoot');const el=document.createElement('div');el.className='toast';el.innerHTML='<span>'+esc(msg)+'</span>';if(actLbl){const b=document.createElement('button');b.textContent=actLbl;b.onclick=function(){if(act)act();el.remove()};el.appendChild(b)}root.appendChild(el);setTimeout(function(){el.style.transition='opacity .25s, transform .25s';el.style.opacity='0';el.style.transform='translateY(10px)';setTimeout(function(){el.remove()},260)},actLbl?4200:2200)}

function resizeImage(file,maxW,quality){if(maxW===undefined)maxW=800;if(quality===undefined)quality=0.7;return new Promise(function(resolve,reject){const r=new FileReader();r.onload=function(e){const img=new Image();img.onload=function(){const s=Math.min(1,maxW/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=e.target.result};r.onerror=reject;r.readAsDataURL(file)})}

function getLocation(){return new Promise(function(resolve,reject){if(!navigator.geolocation){reject(new Error('Không hỗ trợ GPS'));return}navigator.geolocation.getCurrentPosition(function(p){const lat=p.coords.latitude,lng=p.coords.longitude;let name=lat.toFixed(5)+', '+lng.toFixed(5);fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&accept-language=vi&zoom=18').then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.display_name)name=d.display_name;resolve({lat:lat,lng:lng,name:name})}).catch(function(){resolve({lat:lat,lng:lng,name:name})})},function(e){reject(new Error(e.message||'Lỗi vị trí'))},{enableHighAccuracy:true,timeout:15000,maximumAge:60000})})}

function openLightbox(src){const r=$('#sheetRoot');const w=document.createElement('div');w.className='lightbox';w.innerHTML='<button>✕</button><img src="'+src+'">';w.onclick=function(){w.remove()};r.appendChild(w)}

function seed(){const tx=[];const now=new Date();function add(t,c,a,n,d){tx.push({id:uid(),type:t,category:c,amount:a,note:n,date:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),createdAt:d.getTime()+Math.floor(Math.random()*1e6)})}function da(n,h){if(h===undefined)h=10;const d=new Date(now);d.setDate(d.getDate()-n);d.setHours(h,0,0,0);return d}for(let m=0;m<3;m++){const d=new Date(now.getFullYear(),now.getMonth()-m,5,9);if(d<=now)add('income','salary',15000000+m*500000,'Lương tháng '+(d.getMonth()+1),d)}add('income','bonus',2000000,'Thưởng dự án',da(12));const pool=[['food',45000,['Ăn sáng','Bún chả','Cơm trưa']],['food',120000,['Ăn tối nhà hàng']],['drink',35000,['Cà phê sữa','Trà sữa']],['transport',60000,['Grab','Xăng xe']],['shopping',350000,['Quần áo','Shopee']],['bill',480000,['Tiền điện','Internet']],['fun',180000,['Xem phim','Game']],['health',300000,['Khám sức khỏe']],['edu',500000,['Khóa học']],['home',900000,['Đồ dùng gia đình']],['gift',400000,['Quà sinh nhật']]];for(let i=0;i<58;i++){const p=pool[Math.floor(Math.random()*pool.length)];const a=Math.round(p[1]*(0.75+Math.random()*0.6)/1000)*1000;const n=p[2][Math.floor(Math.random()*p[2].length)];add('expense',p[0],a,n,da(Math.floor(Math.random()*60),7+Math.floor(Math.random()*14)))}state.tx=tx;state.totalBudget=12000000;state.budgets={food:4000000,transport:1500000,shopping:1500000,bill:1500000,fun:1000000};save()}

const ICONS={
home:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
stats:'<svg viewBox="0 0 24 24"><path d="M3 21h18"/><rect x="4.5" y="12" width="3.6" height="6" rx="1.2"/><rect x="10.2" y="7" width="3.6" height="11" rx="1.2"/><rect x="15.9" y="14" width="3.6" height="4" rx="1.2"/></svg>',
photos:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="1.8"/><path d="M21 17l-4.5-4.5L12 17l-2.5-2.5L3 21"/></svg>',
settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
};

function renderTabbar(){$('#tabbar').innerHTML='<button class="tab '+(tab==='home'?'active':'')+'" data-tab="home">'+ICONS.home+'<span>Nhà</span></button><button class="tab '+(tab==='stats'?'active':'')+'" data-tab="stats">'+ICONS.stats+'<span>Thống kê</span></button><button class="fab" data-tab="add">'+ICONS.plus+'</button><button class="tab '+(tab==='photos'?'active':'')+'" data-tab="photos">'+ICONS.photos+'<span>Ảnh</span></button><button class="tab '+(tab==='settings'?'active':'')+'" data-tab="settings">'+ICONS.settings+'<span>Cài đặt</span></button>';$$('#tabbar .tab, #tabbar .fab').forEach(function(b){b.onclick=function(){const t=b.dataset.tab;if(t==='add'){openAddSheet();return}tab=t;render()}})}

function render(){if(!currentUser||!state){renderProfileScreen();return}const main=$('#main');main.classList.remove('profile-mode');renderTabbar();if(tab==='home')main.innerHTML=viewHome();else if(tab==='stats')main.innerHTML=viewStats();else if(tab==='photos')main.innerHTML=viewPhotos();else if(tab==='settings')main.innerHTML=viewSettings();main.scrollTop=0;bindView();main.classList.remove('fade-in');void main.offsetWidth;main.classList.add('fade-in')}

function renderProfileScreen(){const main=$('#main');$('#tabbar').innerHTML='';main.classList.add('profile-mode');main.innerHTML='<div class="profile-screen"><div class="profile-logo">💸</div><div class="profile-title">CapMoney</div><div class="profile-sub">Chọn hồ sơ để bắt đầu<br>hoặc tạo hồ sơ mới</div><div class="profile-list">'+allUsers.map(function(u){return'<button class="profile-item" data-uid="'+u.id+'"><div class="profile-avatar">'+(u.emoji||'👤')+'</div><div style="flex:1;min-width:0"><div class="profile-name">'+esc(u.name)+'</div><div class="profile-meta">'+u.data.tx.length+' giao dịch</div></div><span style="color:var(--text3);font-size:18px">›</span></button>'}).join('')+'<button class="profile-add" id="addProfileBtn">＋ Thêm hồ sơ mới</button></div></div>';bindProfileView()}

function bindProfileView(){$$('.profile-item').forEach(function(el){el.onclick=function(){switchUser(el.dataset.uid)}});const a=$('#addProfileBtn');if(a)a.onclick=function(){openCreateProfileSheet()}}

function openCreateProfileSheet(){const root=$('#sheetRoot');const sel={name:'',emoji:'👤'};const w=document.createElement('div');w.className='sheet';w.innerHTML='<div class="sheet-panel" style="max-height:auto" onclick="event.stopPropagation()"><div class="grabber"></div><div class="sheet-head"><button class="muted" id="cpCancel">Hủy</button><div class="title">Tạo hồ sơ mới</div><button id="cpSave">Tạo</button></div><div class="sheet-body" style="padding-bottom:24px"><div style="text-align:center;padding:8px 0 14px"><div style="width:72px;height:72px;border-radius:50%;background:var(--primary-grad);display:grid;place-items:center;font-size:36px;color:#fff;margin:0 auto" id="cpPreview">👤</div></div><div class="field"><span class="fi">✏️</span><input id="cpName" type="text" maxlength="24" placeholder="Tên của bạn"></div><div style="font-size:13px;color:var(--text2);font-weight:650;margin:6px 4px 10px">Chọn avatar</div><div class="emoji-picker" id="cpEmoji">'+AVATARS.map(function(e){return'<button class="emoji-opt '+(e===sel.emoji?'active':'')+'" data-e="'+e+'">'+e+'</button>'}).join('')+'</div></div></div>';root.appendChild(w);function close(){w.style.animation='fade .18s reverse';setTimeout(function(){w.remove()},160)}w.onclick=close;$('#cpCancel',w).onclick=close;const es=$$('#cpEmoji .emoji-opt',w);es.forEach(function(b){b.onclick=function(){sel.emoji=b.dataset.e;es.forEach(function(x){x.classList.remove('active')});b.classList.add('active');$('#cpPreview',w).textContent=sel.emoji}});$('#cpSave',w).onclick=function(){const n=$('#cpName',w).value.trim();if(!n){toast('Nhập tên');return}createUser(n,sel.emoji);close();applyTheme();applyColor();setTimeout(function(){render();toast('Đã tạo ✓')},150)}}

function viewHome(){
  const today=todayStr();const g=greet();const ym=thisYM();
  const monthTx=state.tx.filter(function(t){return ymOf(t.date)===ym});
  const mInc=monthTx.filter(function(t){return t.type==='income'}).reduce(function(s,t){return s+t.amount},0);
  const mExp=monthTx.filter(function(t){return t.type==='expense'}).reduce(function(s,t){return s+t.amount},0);
  const allInc=state.tx.filter(function(t){return t.type==='income'}).reduce(function(s,t){return s+t.amount},0);
  const allExp=state.tx.filter(function(t){return t.type==='expense'}).reduce(function(s,t){return s+t.amount},0);
  const bal=allInc-allExp;
  const hasToday=state.tx.some(function(t){return t.date===today});
  const selTx=state.tx.filter(function(t){return t.date===selDate}).sort(function(a,b){return(b.createdAt||0)-(a.createdAt||0)});
  const selInc=selTx.filter(function(t){return t.type==='income'}).reduce(function(s,t){return s+t.amount},0);
  const selExp=selTx.filter(function(t){return t.type==='expense'}).reduce(function(s,t){return s+t.amount},0);
  const calHTML=renderCalendar();
  let listHTML;
  if(selTx.length){
    listHTML=selTx.map(function(t){
      const c=catById(t.type,t.category);
      const iconHTML=t.photo?'<img src="'+t.photo+'">':c.icon;
      const locTxt=t.location?' · 📍'+t.location.name.split(',')[0]:'';
      return'<div class="tx" data-id="'+t.id+'"><div class="tx-ic" style="background:'+(t.photo?'#000':c.color+'22')+';color:'+c.color+'">'+iconHTML+'</div><div class="tx-bd"><div class="tx-nm">'+esc(c.name)+'</div><div class="tx-meta">'+esc(t.note||c.name)+esc(locTxt)+'</div></div><div class="tx-am '+(t.type==='income'?'pos':'')+'">'+signed(t.amount,t.type)+'</div></div>'
    }).join('')
  } else {
    listHTML='<div class="empty" style="padding:30px 20px"><div class="ico">🧾</div><h3>Không có giao dịch</h3><p>Ngày này chưa có giao dịch nào.</p></div>'
  }
  const monthLabel='Tháng '+(new Date().getMonth()+1);
  return'<div class="hero"><div class="hero-txt"><div class="hero-greet">'+esc(g.text)+'</div><div class="hero-name">'+esc(currentUser.name)+'</div><div class="hero-status">'+(hasToday?'✓ Hôm nay đã ghi chép':'☘ Hôm nay chưa chi tiêu')+'</div></div><button class="hero-avatar" id="heroAvatar">'+currentUser.emoji+'</button></div>'
  +'<div class="top-row"><div class="top-chip"><span class="tc-ico">💼</span><div><div class="tc-lbl">Tổng số dư</div><div class="tc-val">'+moneyH(bal)+'</div></div></div><div class="top-chip"><span class="tc-ico">🏦</span><div><div class="tc-lbl">'+monthLabel+'</div><div class="tc-val">'+moneyH(mInc-mExp)+'</div></div></div></div>'

function renderCalendar(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const first=new Date(y,m,1);const startDay=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const today=todayStr();
  let cells='';
  for(let i=startDay-1;i>=0;i--){cells+='<div class="cal-cell other">'+(prevDays-i)+'</div>'}
  for(let d=1;d<=daysInMonth;d++){
    const ds=y+'-'+pad(m+1)+'-'+pad(d);
    const txDay=state.tx.filter(function(t){return t.date===ds});
    const isToday=ds===today;const isSel=ds===selDate;
    let cls='cal-cell';
    if(isToday)cls+=' today';else if(isSel)cls+=' selected';
    if(txDay.length)cls+=' has-tx';
    const photoTxs=txDay.filter(function(t){return t.photo}).slice(0,2);
    const thumbs=photoTxs.length?'<div class="cal-thumbs">'+photoTxs.map(function(t){return'<img src="'+t.photo+'">'}).join('')+'</div>':'';
    cells+='<div class="'+cls+'" data-date="'+ds+'">'+thumbs+d+(!txDay.length&&isToday?'<div class="cal-plus">+</div>':'')+'</div>'
  }
  const remain=(7-(startDay+daysInMonth)%7)%7;
  for(let i=1;i<=remain;i++){cells+='<div class="cal-cell other">'+i+'</div>'}
  return'<div class="cal-card"><div class="cal-nav"><button class="cn-btn" id="calPrev">‹</button><div class="cn-label">tháng '+(m+1)+' '+y+'</div><button class="cn-btn" id="calNext">›</button></div><div class="cal-head"><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div class="cn">CN</div></div><div class="cal-grid">'+cells+'</div></div>'
}

function viewPhotos(){
  let photoTx=state.tx.filter(function(t){return t.photo});
  if(photoFilter==='expense')photoTx=photoTx.filter(function(t){return t.type==='expense'});
  if(photoFilter==='income')photoTx=photoTx.filter(function(t){return t.type==='income'});
  const totalAll=state.tx.filter(function(t){return t.photo}).length;
  const header='<div class="page-head" style="padding:18px 4px 6px"><h1 style="margin:0;font-size:24px;font-weight:800">Thư viện ảnh</h1><p style="margin:4px 0 0;font-size:13px;color:var(--text2)">'+totalAll+' ảnh trong hồ sơ</p></div><div class="chips" style="margin-top:14px"><button class="chip '+(photoFilter==='all'?'active':'')+'" data-pf="all">📋 Tất cả</button><button class="chip '+(photoFilter==='expense'?'active':'')+'" data-pf="expense">↑ Chi</button><button class="chip '+(photoFilter==='income'?'active':'')+'" data-pf="income">↓ Thu</button></div>';
  if(!photoTx.length){return header+'<div class="empty" style="padding:60px 20px"><div class="ico">📸</div><h3>Chưa có ảnh</h3><p>Chụp ảnh khi thêm giao dịch<br>để lưu hóa đơn tại đây.</p></div>'}
  const grouped={};
  photoTx.forEach(function(t){(grouped[t.date]=grouped[t.date]||[]).push(t)});
  const dates=Object.keys(grouped).sort(function(a,b){return a<b?1:-1});
  let html=header;
  dates.forEach(function(date){
    const items=grouped[date].sort(function(a,b){return(b.createdAt||0)-(a.createdAt||0)});
    const dExp=items.filter(function(t){return t.type==='expense'}).reduce(function(s,t){return s+t.amount},0);
    const dInc=items.filter(function(t){return t.type==='income'}).reduce(function(s,t){return s+t.amount},0);
    const sumParts=[];
    if(dInc)sumParts.push('<span class="g">↑'+moneyH(dInc)+'</span>');
    if(dExp)sumParts.push('<span class="r">↓'+moneyH(dExp)+'</span>');
    html+='<div class="photo-day-head"><div class="pd-date">'+dateLabel(date)+'</div><div class="pd-sum">'+sumParts.join('')+'</div></div>';
    const show=items.slice(0,9);
    html+='<div class="photo-grid">'+show.map(function(t){
      const c=catById(t.type,t.category);
      const tag=t.location?t.location.name.split(',')[0]:c.name;
      const tagShort=tag.length>14?tag.slice(0,14)+'…':tag;
      return'<div class="photo-cell" data-id="'+t.id+'"><img src="'+t.photo+'"><div class="pc-tag">'+esc(tagShort)+'</div><div class="pc-amt">'+(t.type==='income'?'+':'−')+shortMoney(t.amount)+'</div></div>'
    }).join('')+(items.length>9?'<div class="photo-cell more">+'+(items.length-9)+'</div>':'')+'</div>'
  });
  return html
}

function importData(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const p=JSON.parse(ev.target.result);
      if(!Array.isArray(p.tx))throw new Error('bad');
      state.tx=p.tx.map(function(t){return{id:t.id||uid(),type:t.type==='income'?'income':'expense',amount:Number(t.amount)||0,category:t.category||'other',note:String(t.note||''),date:t.date||todayStr(),createdAt:t.createdAt||Date.now(),photo:t.photo||null,location:t.location||null}});
      state.budgets=p.budgets&&typeof p.budgets==='object'?p.budgets:{};
      state.totalBudget=Number(p.totalBudget)||0;
      if(p.settings)state.settings=Object.assign(state.settings,p.settings);
      save();applyTheme();applyColor();render();
      toast('Đã nhập '+state.tx.length+' giao dịch ✓')
    }catch(err){toast('File không hợp lệ ❌')}
    e.target.value=''
  };
  r.readAsText(f)
}

function handleCSVImport(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  e.target.value='';
  const n=f.name.toLowerCase();
  if(n.indexOf('.zip')>-1||f.type==='application/zip'){
    toast('Đang giải nén...');
    JSZip.loadAsync(f).then(function(z){
      const files=Object.keys(z.files).filter(function(fn){const l=fn.toLowerCase();return!z.files[fn].dir&&(l.indexOf('.csv')>-1||l.indexOf('.xls')>-1)});
      if(!files.length){toast('Không có file CSV/Excel ❌');return}
      const t=files[0];
      return z.files[t].async('blob').then(function(b){return processStatementFile(new File([b],t))})
    }).catch(function(err){toast('Lỗi: '+err.message)});
    return
  }
  processStatementFile(f).catch(function(err){toast('Lỗi: '+err.message)})
}

function processStatementFile(f){
  const n=f.name.toLowerCase();
  if(n.indexOf('.csv')>-1){
    return new Promise(function(res){
      Papa.parse(f,{header:true,skipEmptyLines:true,complete:function(r){importParsedRows(r.data);res()},error:function(e){toast('Lỗi CSV: '+e.message);res()}})
    })
  }
  if(n.indexOf('.xls')>-1){
    return f.arrayBuffer().then(function(d){
      const wb=XLSX.read(d,{type:'array'});
      const s=wb.Sheets[wb.SheetNames[0]];
      importParsedRows(XLSX.utils.sheet_to_json(s,{defval:'',raw:false}))
    })
  }
  toast('Định dạng không hỗ trợ ❌');
  return Promise.resolve()
}

function importParsedRows(rows){
  if(!rows||!rows.length){toast('File rỗng ❌');return}
  let imp=0,sk=0;
  rows.forEach(function(row){
    const ks=Object.keys(row);
    const dk=ks.find(function(k){return/ngày|date|ngay/i.test(k)});
    const ak=ks.find(function(k){return/số tiền|amount|số ps|phát sinh|credit|debit|số ghi|giá trị/i.test(k)});
    const nk=ks.find(function(k){return/diễn giải|mô tả|nội dung|description|ghi chú|remark|chi tiết/i.test(k)});
    if(!dk||!ak){sk++;return}
    let ds=String(row[dk]).trim();if(!ds){sk++;return}
    let dp=ds.split(/[\/\-\.\s]/);let date;
    if(dp.length>=3){
      if(dp[0].length===4)date=dp[0]+'-'+pad(dp[1])+'-'+pad(dp[2]);
      else date=dp[2]+'-'+pad(dp[1])+'-'+pad(dp[0])
    } else {sk++;return}
    const ar=String(row[ak]).trim();
    const neg=ar.charAt(0)==='-'||ar.charAt(0)==='('||ar.indexOf('−')>-1;
    const ac=ar.replace(/[^\d]/g,'');
    const amt=Number(ac)||0;
    if(!amt){sk++;return}
    let type='expense';
    if(neg||/debit|ghi nợ|chi/i.test(ak))type='expense';
    else if(/credit|ghi có|thu/i.test(ak))type='income';
    const note=nk?String(row[nk]).trim():'';
    let cat='other';
    const nl=note.toLowerCase();
    if(/cà phê|coffee|cf |trà sữa|highlands|starbucks/i.test(nl))cat='drink';
    else if(/ăn|food|cơm|phở|bún|nhà hàng|quán|buffet|lẩu/i.test(nl))cat='food';
    else if(/grab|taxi|xăng|xe|di chuyển|be |gojek|vé/i.test(nl))cat='transport';
    else if(/shopee|lazada|tiki|mua|quần áo|giày|shop/i.test(nl))cat='shopping';
    else if(/điện|nước|internet|hóa đơn|bill|evn|vnpt|fpt|viettel/i.test(nl))cat='bill';
    else if(/phim|game|giải trí|netflix|spotify|youtube|karaoke/i.test(nl))cat='fun';
    else if(/thuốc|bệnh viện|khám|sức khỏe|y tế|nhà thuốc|pharmacy/i.test(nl))cat='health';
    else if(/lương|salary|thưởng|bonus/i.test(nl))cat='salary';
    else if(/học|khóa|sách|edu|trường/i.test(nl))cat='edu';
    else if(/nhà|home|sửa|đồ dùng/i.test(nl))cat='home';
    else if(/quà|gift|tặng/i.test(nl))cat='gift';
    state.tx.push({id:uid(),type:type,amount:amt,category:cat,note:note,date:date,createdAt:Date.now()+imp,photo:null,location:null});
    imp++
  });
  if(imp){save();render();toast('Đã nhập '+imp+' giao dịch ✓'+(sk?' (bỏ '+sk+')':''))}
  else {toast('Không đọc được giao dịch nào ❌')}
}

// INIT
(function(){
  loadUsers();
  applyTheme();
  if(currentUser&&state){render()}
  else{renderProfileScreen()}
})();
</script>
</body>
