<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CapMoney">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6366F1">
<meta name="description" content="CapMoney – Quản lý chi tiêu cá nhân">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366F1'/%3E%3Cstop offset='1' stop-color='%23A855F7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='115' fill='url(%23g)'/%3E%3Crect x='96' y='160' width='320' height='224' rx='42' fill='white'/%3E%3Ccircle cx='372' cy='272' r='22' fill='%236366F1'/%3E%3Crect x='144' y='308' width='28' height='44' rx='10' fill='%23C7D2FE'/%3E%3Crect x='188' y='282' width='28' height='70' rx='10' fill='%23A5B4FC'/%3E%3Crect x='232' y='252' width='28' height='100' rx='10' fill='%236366F1'/%3E%3C/svg%3E">
<title>CapMoney – Quản lý chi tiêu</title>
<style>
:root{--bg:#F2F3F7;--card:#FFFFFF;--text:#111318;--text2:#8A8F9C;--text3:#B4B9C4;--line:#E9EBF1;--primary:#6366F1;--green:#12B76A;--red:#F04438;--tabbg:rgba(255,255,255,.88);--shadow:0 2px 12px rgba(20,20,40,.06)}
[data-theme="dark"]{--bg:#0B0C10;--card:#16181F;--text:#F5F6FA;--text2:#8A8F9C;--text3:#5A6070;--line:#242733;--tabbg:rgba(22,24,31,.88);--shadow:0 2px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
#app{position:relative;width:100%;max-width:520px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 110px;scroll-behavior:smooth}
.page-head{padding:18px 0 6px}
.page-head h1{margin:0;font-size:26px;letter-spacing:-.5px;font-weight:800}
.page-head p{margin:4px 0 0;font-size:13px;color:var(--text2)}
.balance-card{margin-top:14px;border-radius:24px;padding:22px 22px 20px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#6366F1 0%,#8B5CF6 55%,#A855F7 100%);box-shadow:0 14px 30px rgba(99,102,241,.35)}
.balance-card::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);top:-110px;right:-70px}
.balance-card::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);bottom:-90px;left:-40px}
.bc-label{font-size:12.5px;opacity:.85;letter-spacing:.3px;font-weight:600;text-transform:uppercase}
.bc-amount{font-size:34px;font-weight:800;letter-spacing:-1px;margin:6px 0 18px;position:relative;z-index:1}
.bc-row{display:flex;gap:10px;position:relative;z-index:1}
.bc-item{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.bc-item .lbl{font-size:11px;opacity:.9;font-weight:600}
.bc-item .val{font-size:15px;font-weight:700;margin-top:3px}
.section{margin-top:24px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-head h2{margin:0;font-size:16px;font-weight:700}
.section-head .link{font-size:13px;color:var(--primary);font-weight:600}
.day-head{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 6px;font-size:12.5px;color:var(--text2);font-weight:700}
.day-head .sum{font-weight:600;color:var(--text3)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border-radius:16px;margin-bottom:8px;box-shadow:var(--shadow);transition:transform .12s}
.tx:active{transform:scale(.98)}
.tx-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.tx-body{flex:1;min-width:0}
.tx-name{font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-note{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-size:14.5px;font-weight:750;white-space:nowrap}
.tx-amt.pos{color:var(--green)}
.empty{text-align:center;padding:48px 20px;color:var(--text2)}
.empty .ico{font-size:44px;margin-bottom:10px;opacity:.7}
.empty h3{margin:0 0 6px;font-size:16px;color:var(--text);font-weight:700}
.empty p{margin:0;font-size:13px;line-height:1.5}
#tabbar{position:absolute;left:0;right:0;bottom:0;height:74px;z-index:30;display:flex;align-items:center;justify-content:space-around;background:var(--tabbg);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--text3);width:64px;padding:6px 0;transition:color .15s}
.tab svg{width:23px;height:23px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--primary)}
.fab{width:56px;height:56px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;transform:translateY(-16px);box-shadow:0 10px 22px rgba(99,102,241,.45);transition:transform .15s}
.fab:active{transform:translateY(-16px) scale(.92)}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.sheet{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,9,14,.5);animation:fade .18s ease}
.sheet-panel{width:100%;max-width:520px;max-height:94dvh;background:var(--card);border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s cubic-bezier(.22,1,.36,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex:0 0 auto}
.sheet-head .title{font-size:16px;font-weight:750}
.sheet-head button{font-size:14.5px;font-weight:650;color:var(--primary);padding:6px 4px}
.sheet-head button.muted{color:var(--text2)}
.sheet-head button:disabled{color:var(--text3);opacity:.6}
.sheet-body{flex:1;overflow-y:auto;padding:0 18px}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.seg{display:flex;background:var(--bg);border-radius:13px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--text2)}
.seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.09)}
.seg button.active.exp{color:var(--red)}
.seg button.active.inc{color:var(--green)}
.amount-display{text-align:center;padding:6px 0 18px}
.amount-display .cur{font-size:15px;color:var(--text2);font-weight:600;margin-bottom:2px}
.amount-display .num{font-size:40px;font-weight:800;letter-spacing:-1.5px}
.amount-display .num.exp{color:var(--red)}
.amount-display .num.inc{color:var(--green)}
.amount-display .num.zero{color:var(--text3)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;width:66px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;border-radius:16px;background:var(--bg);border:2px solid transparent;transition:.16s}
.cat .ci{font-size:22px}
.cat .cn{font-size:10.5px;font-weight:650;color:var(--text2);text-align:center;line-height:1.15}
.cat.active{border-color:var(--primary);background:rgba(99,102,241,.1)}
.cat.active .cn{color:var(--primary)}
.field{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.field .fi{font-size:16px;opacity:.7}
.field input{flex:1;border:none;background:none;outline:none;font-size:14.5px;color:var(--text);font-weight:550;width:100%}
.field input::placeholder{color:var(--text3);font-weight:500}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.numpad button{background:var(--card);padding:17px 0;font-size:22px;font-weight:600;color:var(--text)}
.numpad button:active{background:var(--bg)}
.month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 4px}
.month-nav button{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);font-size:16px;color:var(--text2)}
.month-nav .m-label{font-size:15px;font-weight:750;min-width:130px;text-align:center}
.summary-row{display:flex;gap:10px;margin-top:14px}
.sum-card{flex:1;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.sum-card .k{font-size:11.5px;color:var(--text2);font-weight:650;display:flex;align-items:center;gap:5px}
.sum-card .v{font-size:17px;font-weight:800;margin-top:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.donut-wrap{display:flex;justify-content:center;padding:18px 0 6px;position:relative}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.donut-center .dc-l{font-size:11px;color:var(--text2);font-weight:650}
.donut-center .dc-v{font-size:16px;font-weight:800;margin-top:2px}
.legend{margin-top:10px}
.leg{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--card);border-radius:14px;margin-bottom:7px;box-shadow:var(--shadow)}
.leg .li{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.leg .ln{flex:1;min-width:0}
.leg .lname{font-size:13.5px;font-weight:650}
.leg .lbar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.leg .lbar i{display:block;height:100%;border-radius:3px}
.leg .lv{text-align:right}
.leg .lv .a{font-size:13.5px;font-weight:750}
.leg .lv .p{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:170px;padding:14px 4px 0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-top:6px}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.bar-pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bar{width:9px;border-radius:4px 4px 2px 2px;min-height:3px;transition:height .4s}
.bar.exp{background:linear-gradient(180deg,#F97066,#F04438)}
.bar.inc{background:linear-gradient(180deg,#32D583,#12B76A)}
.bar-lbl{font-size:10px;color:var(--text2);font-weight:650}
.chart-legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px;color:var(--text2);font-weight:650}
.chart-legend span{display:flex;align-items:center;gap:6px}
.bud-card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.bud-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.bud-top .bl{font-size:12.5px;color:var(--text2);font-weight:650}
.bud-top .bv{font-size:20px;font-weight:800;margin-top:3px}
.progress{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;border-radius:6px;transition:width .5s}
.bud-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.bud-item:last-child{border-bottom:none}
.bud-item .bi{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.bud-item .bb{flex:1;min-width:0}
.bud-item .bt{display:flex;justify-content:space-between;font-size:13.5px;font-weight:650;margin-bottom:7px}
.bud-item .bt .amt{color:var(--text2);font-weight:600;font-size:12.5px}
.bud-input{width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:650;color:var(--text);outline:none;text-align:right}
.bud-input:focus{border-color:var(--primary);background:var(--card)}
.set-group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.set-item{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.set-item:last-child{border-bottom:none}
.set-item .si{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--bg);flex:0 0 auto}
.set-item .st{flex:1}
.set-item .st .a{font-size:14.5px;font-weight:650}
.set-item .st .b{font-size:12px;color:var(--text2);margin-top:2px}
.set-item .arrow{color:var(--text3);font-size:16px}
.set-item.danger .st .a{color:var(--red)}
select.mini{background:var(--bg);border:none;border-radius:9px;padding:7px 9px;font-size:13px;font-weight:650;color:var(--text);outline:none}
#toastRoot{position:fixed;left:0;right:0;bottom:96px;z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#1C1D22;color:#fff;padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastIn .28s;pointer-events:auto;max-width:100%}
.toast button{color:#A5B4FC;font-weight:750;font-size:13.5px}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
<main id="main"></main>
<nav id="tabbar"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const CATS={
expense:[{id:'food',name:'Ăn uống',icon:'🍜',color:'#FF7A59'},{id:'drink',name:'Cà phê',icon:'☕️',color:'#B07C4F'},{id:'transport',name:'Di chuyển',icon:'🚕',color:'#4C9AFF'},{id:'shopping',name:'Mua sắm',icon:'🛍️',color:'#FF5C8A'},{id:'bill',name:'Hóa đơn',icon:'🧾',color:'#7C6BFF'},{id:'fun',name:'Giải trí',icon:'🎮',color:'#22C55E'},{id:'health',name:'Sức khỏe',icon:'💊',color:'#F43F5E'},{id:'edu',name:'Giáo dục',icon:'📚',color:'#0EA5E9'},{id:'home',name:'Nhà cửa',icon:'🏠',color:'#EAB308'},{id:'gift',name:'Quà tặng',icon:'🎁',color:'#EC4899'},{id:'other',name:'Khác',icon:'📦',color:'#94A3B8'}],
income:[{id:'salary',name:'Lương',icon:'💰',color:'#12B76A'},{id:'bonus',name:'Thưởng',icon:'🎉',color:'#F59E0B'},{id:'invest',name:'Đầu tư',icon:'📈',color:'#6366F1'},{id:'other_in',name:'Thu khác',icon:'💵',color:'#14B8A6'}]};
const catById=(t,id)=>CATS[t].find(c=>c.id===id)||{id:'other',name:'Khác',icon:'📦',color:'#94A3B8'};
const STORE_KEY='capmoney_v1';
let state={tx:[],budgets:{},totalBudget:0,settings:{theme:'auto',currency:'đ'}};
let tab='home';
let statsYM=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()}})();
let statsType='expense';
let lastDeleted=null;
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return false;const p=JSON.parse(raw);state.tx=Array.isArray(p.tx)?p.tx:[];state.budgets=p.budgets&&typeof p.budgets==='object'?p.budgets:{};state.totalBudget=Number(p.totalBudget)||0;state.settings=Object.assign({theme:'auto',currency:'đ'},p.settings||{});return true}catch(e){return false}}
function money(n,withCur=true){const v=Math.round(Number(n)||0);const s=new Intl.NumberFormat('vi-VN').format(Math.abs(v));return withCur?s+' '+state.settings.currency:s}
const signed=(n,t)=>(t==='income'?'+':'−')+money(n);
function shortMoney(n){const v=Math.abs(Number(n)||0);if(v>=1e9)return(v/1e9).toFixed(v%1e9===0?0:1).replace('.',',')+' tỷ';if(v>=1e6)return(v/1e6).toFixed(v%1e6===0?0:1).replace('.',',')+' tr';if(v>=1e3)return Math.round(v/1e3)+'k';return String(v)}
function dateLabel(ds){const d=new Date(ds+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);const diff=Math.round((t-d)/86400000);if(diff===0)return'Hôm nay';if(diff===1)return'Hôm qua';if(diff===2)return'Hôm trước';if(diff===3)return'3 ngày trước';return`${d.getDate()} tháng ${d.getMonth()+1}, ${d.getFullYear()}`}
const ymOf=ds=>ds.slice(0,7);
const thisYM=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}`};
function applyTheme(){const t=state.settings.theme;const dark=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#0B0C10':'#6366F1'}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.settings.theme==='auto')applyTheme()});
function toast(msg,actionLabel,action){const root=$('#toastRoot');const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${esc(msg)}</span>`;if(actionLabel){const b=document.createElement('button');b.textContent=actionLabel;b.onclick=()=>{action&&action();el.remove()};el.appendChild(b)}root.appendChild(el);setTimeout(()=>{el.style.transition='opacity .25s, transform .25s';el.style.opacity='0';el.style.transform='translateY(10px)';setTimeout(()=>el.remove(),260)},actionLabel?4200:2000)}
function seed(){const tx=[];const now=new Date();const add=(type,cat,amount,note,d)=>{tx.push({id:uid(),type,category:cat,amount,note,date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,createdAt:d.getTime()+Math.floor(Math.random()*1e6)})};const dayAgo=(n,h=10,min=0)=>{const d=new Date(now);d.setDate(d.getDate()-n);d.setHours(h,min,0,0);return d};for(let m=0;m<3;m++){const d=new Date(now.getFullYear(),now.getMonth()-m,5,9,0,0);if(d<=now)add('income','salary',15000000+m*500000,'Lương tháng '+(d.getMonth()+1),d)}add('income','bonus',2000000,'Thưởng dự án',dayAgo(12));const pool=[['food',45000,['Ăn sáng','Bún chả','Cơm trưa','Phở bò']],['food',120000,['Ăn tối nhà hàng','Buffet']],['drink',35000,['Cà phê sữa','Trà sữa']],['transport',60000,['Grab','Xăng xe','Taxi']],['shopping',350000,['Quần áo','Giày','Shopee']],['bill',480000,['Tiền điện','Internet','Tiền nước']],['fun',180000,['Xem phim','Karaoke','Game']],['health',300000,['Khám sức khỏe','Thuốc']],['edu',500000,['Khóa học','Sách']],['home',900000,['Đồ dùng gia đình','Sửa chữa']],['gift',400000,['Quà sinh nhật']]];for(let i=0;i<58;i++){const p=pool[Math.floor(Math.random()*pool.length)];const amt=Math.round(p[1]*(0.75+Math.random()*0.6)/1000)*1000;const note=p[2][Math.floor(Math.random()*p[2].length)];add('expense',p[0],amt,note,dayAgo(Math.floor(Math.random()*60),7+Math.floor(Math.random()*14),Math.floor(Math.random()*60)))}state.tx=tx;state.totalBudget=12000000;state.budgets={food:4000000,transport:1500000,shopping:1500000,bill:1500000,fun:1000000};save()}
const ICONS={home:`<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>`,stats:`<svg viewBox="0 0 24 24"><path d="M3 21h18"/><rect x="4.5" y="12" width="3.6" height="6" rx="1.2"/><rect x="10.2" y="7" width="3.6" height="11" rx="1.2"/><rect x="15.9" y="14" width="3.6" height="4" rx="1.2"/></svg>`,budget:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/></svg>`,settings:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,plus:`<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`};
function renderTabbar(){$('#tabbar').innerHTML=`<button class="tab ${tab==='home'?'active':''}" data-tab="home">${ICONS.home}<span>Trang chủ</span></button><button class="tab ${tab==='stats'?'active':''}" data-tab="stats">${ICONS.stats}<span>Thống kê</span></button><button class="fab" data-tab="add">${ICONS.plus}</button><button class="tab ${tab==='budget'?'active':''}" data-tab="budget">${ICONS.budget}<span>Ngân sách</span></button><button class="tab ${tab==='settings'?'active':''}" data-tab="settings">${ICONS.settings}<span>Cài đặt</span></button>`;$$('#tabbar .tab, #tabbar .fab').forEach(b=>{b.onclick=()=>{const t=b.dataset.tab;if(t==='add'){openAddSheet();return}tab=t;render()}})}
function render(){renderTabbar();const main=$('#main');if(tab==='home')main.innerHTML=viewHome();if(tab==='stats')main.innerHTML=viewStats();if(tab==='budget')main.innerHTML=viewBudget();if(tab==='settings')main.innerHTML=viewSettings();main.scrollTop=0;bindView();main.classList.remove('fade-in');void main.offsetWidth;main.classList.add('fade-in')}
function viewHome(){const ym=thisYM();const monthTx=state.tx.filter(t=>ymOf(t.date)===ym);const mIncome=monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);const mExpense=monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);const allIncome=state.tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);const allExpense=state.tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);const balance=allIncome-allExpense;const sorted=[...state.tx].sort((a,b)=>a.date===b.date?(b.createdAt||0)-(a.createdAt||0):(a.date<b.date?1:-1));const groups={};sorted.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t)});const recentDates=Object.keys(groups).slice(0,12);let listHTML='';if(!sorted.length){listHTML=`<div class="empty"><div class="ico">🧾</div><h3>Chưa có giao dịch</h3><p>Nhấn nút <b>+</b> để thêm khoản chi tiêu<br>hoặc thu nhập đầu tiên.</p></div>`}else{listHTML=recentDates.map(date=>{const items=groups[date];const dayExp=items.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);const dayInc=items.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);const sumTxt=[dayExp?'−'+shortMoney(dayExp):'',dayInc?'+'+shortMoney(dayInc):''].filter(Boolean).join('  ');return`<div class="day-head"><span>${dateLabel(date)}</span><span class="sum">${sumTxt}</span></div>${items.map(t=>{const c=catById(t.type,t.category);return`<div class="tx" data-id="${t.id}"><div class="tx-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div><div class="tx-body"><div class="tx-name">${esc(c.name)}</div>${t.note?`<div class="tx-note">${esc(t.note)}</div>`:`<div class="tx-note" style="opacity:.5">Không có ghi chú</div>`}</div><div class="tx-amt ${t.type==='income'?'pos':'neg'}">${signed(t.amount,t.type)}</div></div>`}).join('')}`}).join('')}return`<div class="page-head"><h1>Xin chào 👋</h1><p>Tháng ${new Date().getMonth()+1} · Tổng quan tài chính</p></div><div class="balance-card"><div class="bc-label">Số dư hiện tại</div><div class="bc-amount">${money(balance)}</div><div class="bc-row"><div class="bc-item"><div class="lbl">↓ Thu nhập</div><div class="val">${shortMoney(mIncome)}</div></div><div class="bc-item"><div class="lbl">↑ Chi tiêu</div><div class="val">${shortMoney(mExpense)}</div></div></div></div><div class="section"><div class="section-head"><h2>Giao dịch gần đây</h2><span class="link" id="goStats">Thống kê</span></div>${listHTML}${sorted.length?`<div style="text-align:center;padding:14px 0 4px;font-size:12.5px;color:var(--text2)">Tổng cộng ${state.tx.length} giao dịch</div>`:''}</div>`}
function viewStats(){const{y,m}=statsYM;const ym=`${y}-${pad(m+1)}`;const monthTx=state.tx.filter(t=>ymOf(t.date)===ym);const list=monthTx.filter(t=>t.type===statsType);const total=list.reduce((s,t)=>s+t.amount,0);const otherTotal=monthTx.filter(t=>t.type!==statsType).reduce((s,t)=>s+t.amount,0);const byCat={};list.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount});const rows=Object.entries(byCat).map(([id,val])=>({...catById(statsType,id),val})).sort((a,b)=>b.val-a.val);let donut='';if(total>0){const R=62,C=2*Math.PI*R,CX=90,CY=90;let offset=0;const segs=rows.map(r=>{const len=(r.val/total)*C;const seg=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${r.color}" stroke-width="24" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${CX} ${CY})"/>`;offset+=len;return seg}).join('');donut=`<div class="donut-wrap"><svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="62" fill="none" stroke="var(--line)" stroke-width="24"/>${segs}</svg><div class="donut-center"><div class="dc-l">Tổng ${statsType==='expense'?'chi':'thu'}</div><div class="dc-v">${shortMoney(total)}</div></div></div>`}else{donut=`<div class="empty" style="padding:36px 20px"><div class="ico">📊</div><h3>Chưa có dữ liệu</h3><p>Không có giao dịch nào trong tháng này.</p></div>`}const months=[];for(let i=5;i>=0;i--){let mm=m-i,yy=y;while(mm<0){mm+=12;yy--}months.push({y:yy,m:mm})}const barData=months.map(mo=>{const key=`${mo.y}-${pad(mo.m+1)}`;const mt=state.tx.filter(t=>ymOf(t.date)===key);return{label:'T'+(mo.m+1),exp:mt.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),inc:mt.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0)}});const maxVal=Math.max(1,...barData.map(d=>Math.max(d.exp,d.inc)));const barsHTML=`<div class="bars">${barData.map(d=>`<div class="bar-group"><div class="bar-pair"><div class="bar exp" style="height:${(d.exp/maxVal)*100}%"></div><div class="bar inc" style="height:${(d.inc/maxVal)*100}%"></div></div><div class="bar-lbl">${d.label}</div></div>`).join('')}</div><div class="chart-legend"><span><i class="dot" style="background:#F04438"></i> Chi tiêu</span><span><i class="dot" style="background:#12B76A"></i> Thu nhập</span></div>`;return`<div class="page-head"><h1>Thống kê</h1><p>Phân tích dòng tiền của bạn</p></div><div class="month-nav"><button id="prevMonth">‹</button><div class="m-label">Tháng ${m+1}, ${y}</div><button id="nextMonth" ${ym>=thisYM()?'style="opacity:.35"':''}>›</button></div><div class="seg" style="margin-top:14px"><button class="${statsType==='expense'?'active exp':''}" data-stype="expense">Chi tiêu</button><button class="${statsType==='income'?'active inc':''}" data-stype="income">Thu nhập</button></div><div class="summary-row"><div class="sum-card"><div class="k"><i class="dot" style="background:${statsType==='expense'?'#F04438':'#12B76A'}"></i> Tổng ${statsType==='expense'?'chi tiêu':'thu nhập'}</div><div class="v">${money(total)}</div></div><div class="sum-card"><div class="k"><i class="dot" style="background:${statsType==='expense'?'#12B76A':'#F04438'}"></i> ${statsType==='expense'?'Thu nhập':'Chi tiêu'}</div><div class="v">${money(otherTotal)}</div></div></div>${donut}${rows.length?`<div class="legend">${rows.map(r=>{const pct=total?(r.val/total*100):0;return`<div class="leg"><div class="li" style="background:${r.color}22;color:${r.color}">${r.icon}</div><div class="ln"><div class="lname">${esc(r.name)}</div><div class="lbar"><i style="width:${pct}%;background:${r.color}"></i></div></div><div class="lv"><div class="a">${money(r.val)}</div><div class="p">${pct.toFixed(1)}%</div></div></div>`}).join('')}</div>`:''}<div class="section"><div class="section-head"><h2>6 tháng gần đây</h2></div>${barsHTML}</div>`}
function viewBudget(){const ym=thisYM();const monthTx=state.tx.filter(t=>ymOf(t.date)===ym&&t.type==='expense');const spentTotal=monthTx.reduce((s,t)=>s+t.amount,0);const tb=Number(state.totalBudget)||0;const tbPct=tb?clamp(spentTotal/tb*100,0,100):0;const tbColor=tbPct>=100?'#F04438':tbPct>=80?'#F79009':'#12B76A';const rows=CATS.expense.map(c=>{const spent=monthTx.filter(t=>t.category===c.id).reduce((s,t)=>s+t.amount,0);const budget=Number(state.budgets[c.id])||0;const pct=budget?clamp(spent/budget*100,0,100):0;const barColor=budget?(pct>=100?'#F04438':pct>=80?'#F79009':c.color):'var(--line)';return{...c,spent,budget,pct,barColor}}).sort((a,b)=>(b.budget-a.budget)||(b.spent-a.spent));const remaining=tb-spentTotal;return`<div class="page-head"><h1>Ngân sách</h1><p>Tháng ${new Date().getMonth()+1} · Kiểm soát chi tiêu</p></div><div class="bud-card" style="margin-top:14px"><div class="bud-top"><div><div class="bl">Đã chi / Ngân sách tháng</div><div class="bv">${money(spentTotal)} <span style="font-size:14px;color:var(--text2);font-weight:650">/ ${tb?money(tb):'chưa đặt'}</span></div></div><div style="text-align:right"><div class="bl">Còn lại</div><div class="bv" style="color:${remaining>=0?'var(--green)':'var(--red)'};font-size:17px">${money(remaining)}</div></div></div><div class="progress"><i style="width:${tbPct}%;background:${tbColor}"></i></div><div style="margin-top:14px"><div class="bl" style="font-size:12.5px;color:var(--text2);font-weight:650;margin-bottom:7px">Ngân sách tổng tháng</div><input class="bud-input" id="totalBudgetInput" type="text" inputmode="numeric" placeholder="0" value="${tb?new Intl.NumberFormat('vi-VN').format(tb):''}"></div></div><div class="section-head" style="margin-top:22px"><h2>Ngân sách theo danh mục</h2></div><div class="bud-card" style="padding:6px 18px">${rows.map(r=>`<div class="bud-item"><div class="bi" style="background:${r.color}22;color:${r.color}">${r.icon}</div><div class="bb"><div class="bt"><span>${esc(r.name)}</span><span class="amt">${money(r.spent)}${r.budget?' / '+money(r.budget):''}</span></div><div class="progress" style="height:7px"><i style="width:${r.pct}%;background:${r.barColor}"></i></div><input class="bud-input" style="margin-top:8px" data-cat="${r.id}" type="text" inputmode="numeric" placeholder="Đặt ngân sách..." value="${r.budget?new Intl.NumberFormat('vi-VN').format(r.budget):''}"></div></div>`).join('')}</div>`}
function viewSettings(){const totalTx=state.tx.length;const themeLabel={auto:'Theo hệ thống',light:'Sáng',dark:'Tối'}[state.settings.theme];const cur=state.settings.currency;return`<div class="page-head"><h1>Cài đặt</h1><p>Tùy chỉnh ứng dụng</p></div><div class="set-group" style="margin-top:14px"><div class="set-item"><div class="si">🎨</div><div class="st"><div class="a">Giao diện</div><div class="b">${themeLabel}</div></div><select class="mini" id="themeSel"><option value="auto" ${state.settings.theme==='auto'?'selected':''}>Tự động</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Sáng</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Tối</option></select></div><div class="set-item"><div class="si">💱</div><div class="st"><div class="a">Đơn vị tiền tệ</div><div class="b">Ký hiệu hiển thị</div></div><select class="mini" id="curSel">${['đ','₫','VND','$','€'].map(c=>`<option value="${c}" ${cur===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="set-group"><button class="set-item" id="btnExport"><div class="si">📤</div><div class="st"><div class="a">Xuất dữ liệu</div><div class="b">Tải file JSON sao lưu</div></div><div class="arrow">›</div></button><button class="set-item" id="btnImport"><div class="si">📥</div><div class="st"><div class="a">Nhập dữ liệu</div><div class="b">Khôi phục từ file JSON</div></div><div class="arrow">›</div></button><button class="set-item" id="btnDemo"><div class="si">✨</div><div class="st"><div class="a">Tạo dữ liệu mẫu</div><div class="b">Thêm giao dịch demo</div></div><div class="arrow">›</div></button></div><div class="set-group"><button class="set-item danger" id="btnClear"><div class="si">🗑️</div><div class="st"><div class="a">Xóa toàn bộ dữ liệu</div><div class="b">${totalTx} giao dịch sẽ bị xóa vĩnh viễn</div></div><div class="arrow">›</div></button></div><div style="text-align:center;padding:18px 0 6px;color:var(--text2);font-size:12px;line-height:1.7"><div style="font-size:26px;margin-bottom:6px">💸</div><b style="color:var(--text);font-size:14px">CapMoney</b><br>Phiên bản 1.0.0 · Dữ liệu lưu trên máy bạn<br><span style="opacity:.7">Không gửi dữ liệu lên máy chủ.</span></div><input type="file" id="fileInput" accept="application/json" style="display:none">`}
function bindView(){$$('#main .tx').forEach(el=>{el.onclick=()=>openTxDetail(el.dataset.id)});const gs=$('#goStats');if(gs)gs.onclick=()=>{tab='stats';render()};const pm=$('#prevMonth');if(pm)pm.onclick=()=>{let{y,m}=statsYM;m--;if(m<0){m=11;y--}statsYM={y,m};render()};const nm=$('#nextMonth');if(nm)nm.onclick=()=>{const cur=thisYM();let{y,m}=statsYM;m++;if(m>11){m=0;y++}if(`${y}-${pad(m+1)}`>cur)return;statsYM={y,m};render()};$$('#main [data-stype]').forEach(b=>{b.onclick=()=>{statsType=b.dataset.stype;render()}});const tbi=$('#totalBudgetInput');if(tbi){tbi.oninput=()=>{const d=tbi.value.replace(/\D/g,'').slice(0,12);tbi.value=d?new Intl.NumberFormat('vi-VN').format(Number(d)):''};tbi.onblur=()=>{state.totalBudget=Number(tbi.value.replace(/\D/g,''))||0;save();render()}}$$('#main [data-cat]').forEach(inp=>{inp.oninput=()=>{const d=inp.value.replace(/\D/g,'').slice(0,12);inp.value=d?new Intl.NumberFormat('vi-VN').format(Number(d)):''};inp.onblur=()=>{const v=Number(inp.value.replace(/\D/g,''))||0;if(v)state.budgets[inp.dataset.cat]=v;else delete state.budgets[inp.dataset.cat];save();render()}});const ts=$('#themeSel');if(ts)ts.onchange=()=>{state.settings.theme=ts.value;save();applyTheme();render()};const cs=$('#curSel');if(cs)cs.onchange=()=>{state.settings.currency=cs.value;save();render()};const be=$('#btnExport');if(be)be.onclick=exportData;const bi=$('#btnImport');if(bi)bi.onclick=()=>$('#fileInput').click();const fi=$('#fileInput');if(fi)fi.onchange=importData;const bd=$('#btnDemo');if(bd)bd.onclick=()=>{const keep=state.tx.slice();seed();state.tx=keep.concat(state.tx);save();render();toast('Đã thêm dữ liệu mẫu ✨')};const bc=$('#btnClear');if(bc)bc.onclick=()=>openConfirmSheet('Xóa toàn bộ dữ liệu?','Tất cả giao dịch và ngân sách sẽ bị xóa vĩnh viễn.','Xóa tất cả',()=>{state.tx=[];state.budgets={};state.totalBudget=0;save();render();toast('Đã xóa toàn bộ dữ liệu')})}
let draft=null;
function openAddSheet(editTx=null){draft=editTx?{id:editTx.id,type:editTx.type,amount:String(editTx.amount),category:editTx.category,note:editTx.note||'',date:editTx.date}:{id:null,type:'expense',amount:'',category:CATS.expense[0].id,note:'',date:todayStr()};const root=$('#sheetRoot');const wrap=document.createElement('div');wrap.className='sheet';wrap.innerHTML=`<div class="sheet-panel" onclick="event.stopPropagation()"><div class="grabber"></div><div class="sheet-head"><button class="muted" id="shCancel">Hủy</button><div class="title">${editTx?'Sửa giao dịch':'Thêm giao dịch'}</div><button id="shSave" ${draft.amount?'':'disabled'}>Lưu</button></div><div class="sheet-body"><div class="seg" id="shSeg"><button class="${draft.type==='expense'?'active exp':''}" data-t="expense">Chi tiêu</button><button class="${draft.type==='income'?'active inc':''}" data-t="income">Thu nhập</button></div><div class="amount-display"><div class="cur">Số tiền (${state.settings.currency})</div><div class="num ${draft.type==='expense'?'exp':'inc'} ${draft.amount?'':'zero'}" id="amtDisplay">${draft.amount?money(draft.amount,false):'0'}</div></div><div class="cats" id="shCats"></div><div class="field"><span class="fi">📝</span><input id="shNote" type="text" maxlength="60" placeholder="Ghi chú (không bắt buộc)" value="${esc(draft.note)}"></div><div class="field"><span class="fi">📅</span><input id="shDate" type="date" value="${draft.date}"></div><div style="height:12px"></div></div><div class="numpad" id="shPad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="000">000</button><button data-k="0">0</button><button data-k="del">⌫</button></div></div>`;root.appendChild(wrap);const close=()=>{wrap.style.animation='fade .18s reverse';setTimeout(()=>wrap.remove(),160)};wrap.onclick=close;$('#shCancel',wrap).onclick=close;const renderCats=()=>{$('#shCats',wrap).innerHTML=CATS[draft.type].map(c=>`<button class="cat ${draft.category===c.id?'active':''}" data-c="${c.id}"><span class="ci">${c.icon}</span><span class="cn">${esc(c.name)}</span></button>`).join('');$$('#shCats .cat',wrap).forEach(b=>{b.onclick=()=>{draft.category=b.dataset.c;renderCats()}})};renderCats();$$('#shSeg button',wrap).forEach(b=>{b.onclick=()=>{if(draft.type===b.dataset.t)return;draft.type=b.dataset.t;draft.category=CATS[draft.type][0].id;$$('#shSeg button',wrap).forEach(x=>{x.className=x.dataset.t===draft.type?`active ${draft.type==='expense'?'exp':'inc'}`:''});const nd=$('#amtDisplay',wrap);nd.className=`num ${draft.type==='expense'?'exp':'inc'} ${draft.amount?'':'zero'}`;renderCats();updateSave()}});$('#shNote',wrap).oninput=e=>{draft.note=e.target.value};$('#shDate',wrap).onchange=e=>{draft.date=e.target.value||todayStr()};const updateSave=()=>{$('#shSave',wrap).disabled=!(Number(draft.amount)>0)};const updateAmt=()=>{const el=$('#amtDisplay',wrap);el.textContent=draft.amount?money(draft.amount,false):'0';el.className=`num ${draft.type==='expense'?'exp':'inc'} ${draft.amount?'':'zero'}`;updateSave()};$$('#shPad button',wrap).forEach(b=>{b.onclick=()=>{const k=b.dataset.k;if(k==='del')draft.amount=draft.amount.slice(0,-1);else if(k==='000'){if(draft.amount&&draft.amount.length<=9)draft.amount+='000'}else{if(draft.amount.length<12)draft.amount+=k}updateAmt()}});$('#shSave',wrap).onclick=()=>{const amount=Number(draft.amount);if(!(amount>0))return;if(draft.id){const t=state.tx.find(x=>x.id===draft.id);if(t)Object.assign(t,{type:draft.type,amount,category:draft.category,note:draft.note.trim(),date:draft.date})}else{state.tx.push({id:uid(),type:draft.type,amount,category:draft.category,note:draft.note.trim(),date:draft.date,createdAt:Date.now()})}save();close();setTimeout(()=>{render();toast(draft.id?'Đã cập nhật giao dịch':'Đã thêm giao dịch ✓')},120)};updateSave()}
function openTxDetail(id){const t=state.tx.find(x=>x.id===id);if(!t)return;const c=catById(t.type,t.category);const root=$('#sheetRoot');const wrap=document.createElement('div');wrap.className='sheet';wrap.innerHTML=`<div class="sheet-panel" style="max-height:auto" onclick="event.stopPropagation()"><div class="grabber"></div><div class="sheet-body" style="padding:8px 18px 20px"><div style="text-align:center;padding:14px 0 6px"><div style="width:64px;height:64px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;font-size:30px;background:${c.color}22;color:${c.color}">${c.icon}</div><div style="font-size:13px;color:var(--text2);font-weight:650">${esc(c.name)}</div><div style="font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-top:6px;color:${t.type==='income'?'var(--green)':'var(--text)'}">${signed(t.amount,t.type)}</div></div><div class="field" style="margin-top:16px;justify-content:space-between"><span style="font-size:13.5px;color:var(--text2);font-weight:600">Ghi chú</span><span style="font-size:13.5px;font-weight:600">${t.note?esc(t.note):'—'}</span></div><div class="field" style="justify-content:space-between"><span style="font-size:13.5px;color:var(--text2);font-weight:600">Ngày</span><span style="font-size:13.5px;font-weight:600">${dateLabel(t.date)}</span></div><div style="display:flex;gap:10px;margin-top:16px"><button id="tdEdit" style="flex:1;padding:15px;border-radius:16px;background:var(--bg);font-size:14.5px;font-weight:700;color:var(--primary)">Sửa</button><button id="tdDel" style="flex:1;padding:15px;border-radius:16px;background:rgba(240,68,56,.1);font-size:14.5px;font-weight:700;color:var(--red)">Xóa</button></div></div></div>`;root.appendChild(wrap);const close=()=>{wrap.style.animation='fade .18s reverse';setTimeout(()=>wrap.remove(),160)};wrap.onclick=close;$('#tdEdit',wrap).onclick=()=>{close();setTimeout(()=>openAddSheet(t),180)};$('#tdDel',wrap).onclick=()=>{const idx=state.tx.findIndex(x=>x.id===t.id);if(idx>-1){lastDeleted={tx:state.tx[idx],index:idx};state.tx.splice(idx,1);save()}close();setTimeout(()=>{render();toast('Đã xóa giao dịch','Hoàn tác',()=>{if(lastDeleted){state.tx.splice(lastDeleted.index,0,lastDeleted.tx);lastDeleted=null;save();render();toast('Đã khôi phục ✓')}})},150)}}
function openConfirmSheet(title,desc,confirmLabel,onConfirm){const root=$('#sheetRoot');const wrap=document.createElement('div');wrap.className='sheet';wrap.innerHTML=`<div class="sheet-panel" style="max-height:auto" onclick="event.stopPropagation()"><div class="grabber"></div><div style="padding:22px 22px 24px;text-align:center"><div style="width:56px;height:56px;border-radius:19px;margin:0 auto 14px;display:grid;place-items:center;font-size:26px;background:rgba(240,68,56,.12)">⚠️</div><div style="font-size:17px;font-weight:750;margin-bottom:8px">${esc(title)}</div><div style="font-size:13.5px;color:var(--text2);line-height:1.55;margin-bottom:20px">${esc(desc)}</div><div style="display:flex;gap:10px"><button id="cfNo" style="flex:1;padding:15px;border-radius:16px;background:var(--bg);font-size:14.5px;font-weight:700">Hủy</button><button id="cfYes" style="flex:1;padding:15px;border-radius:16px;background:var(--red);color:#fff;font-size:14.5px;font-weight:700">${esc(confirmLabel)}</button></div></div></div>`;root.appendChild(wrap);const close=()=>{wrap.style.animation='fade .18s reverse';setTimeout(()=>wrap.remove(),160)};wrap.onclick=close;$('#cfNo',wrap).onclick=close;$('#cfYes',wrap).onclick=()=>{close();setTimeout(onConfirm,150)}}
function exportData(){const data=JSON.stringify({app:'CapMoney',version:1,exportedAt:new Date().toISOString(),...state},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`capmoney-backup-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã xuất file sao lưu 📤')}
function importData(e){const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(!Array.isArray(p.tx))throw new Error('bad');state.tx=p.tx.map(t=>({id:t.id||uid(),type:t.type==='income'?'income':'expense',amount:Number(t.amount)||0,category:t.category||'other',note:String(t.note||''),date:t.date||todayStr(),createdAt:t.createdAt||Date.now()}));state.budgets=p.budgets&&typeof p.budgets==='object'?p.budgets:{};state.totalBudget=Number(p.totalBudget)||0;if(p.settings)state.settings=Object.assign(state.settings,p.settings);save();applyTheme();render();toast(`Đã nhập ${state.tx.length} giao dịch ✓`)}catch(err){toast('File không hợp lệ ❌')}e.target.value=''};reader.readAsText(file)}
(function init(){const had=load();if(!had){seed();save()}applyTheme();render()})();
</script>
</body>
