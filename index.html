<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Chi Tiêu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #1f2937;
    min-height: 100vh;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-bottom: 40px;
  }

  header h1 {
    font-size: 22px;
    text-align: center;
    padding: 8px 0;
    font-weight: 700;
  }

  /* ---------- Tổng quan ---------- */
  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card span { font-size: 13px; opacity: .75; font-weight: 500; }
  .card strong { font-size: 20px; font-weight: 700; }

  .card.balance {
    grid-column: span 2;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    box-shadow: 0 6px 18px rgba(102,126,234,.35);
  }
  .card.balance strong { font-size: 30px; }
  .card.income strong { color: #10b981; }
  .card.expense strong { color: #ef4444; }

  /* ---------- Form ---------- */
  .form-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  .type-toggle {
    display: flex;
    background: #f3f4f6;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 14px;
  }

  .type-toggle button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    color: #6b7280;
    cursor: pointer;
    transition: .2s;
  }

  .type-toggle button.active {
    background: #fff;
    color: #111827;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
  }

  #txForm { display: flex; flex-direction: column; gap: 10px; }

  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }

  input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
    color: #1f2937;
    outline: none;
    transition: border-color .2s;
  }

  input:focus, select:focus { border-color: #667eea; }

  .btn-primary {
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, opacity .2s;
  }
  .btn-primary:active { transform: scale(.98); }

  .btn-cancel {
    padding: 11px;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    background: #fff;
    color: #6b7280;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .hidden { display: none !important; }

  /* ---------- Bộ lọc ---------- */
  .filter {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .filter input { flex: 1; }
  .filter button {
    padding: 12px 18px;
    border: 1.5px solid #e5e7eb;
    background: #fff;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    color: #6b7280;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ---------- Thống kê ---------- */
  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  .panel h2 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
    color: #374151;
  }

  .bar-row { margin-bottom: 12px; }

  .bar-label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
  }

  .bar-track {
    height: 9px;
    background: #f3f4f6;
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    transition: width .4s ease;
  }

  .bar-value {
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
    text-align: right;
  }

  /* ---------- Danh sách ---------- */
  #txList { list-style: none; display: flex; flex-direction: column; gap: 8px; }

  .tx-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 12px;
    background: #fafafa;
    transition: background .2s;
  }
  .tx-item:hover { background: #f3f4f6; }

  .tx-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .tx-icon.expense { background: #fee2e2; }
  .tx-icon.income  { background: #d1fae5; }

  .tx-info { flex: 1; min-width: 0; }

  .tx-name { font-size: 14px; font-weight: 600; }

  .tx-meta {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tx-amount {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }
  .tx-amount.expense { color: #ef4444; }
  .tx-amount.income  { color: #10b981; }

  .tx-actions { display: flex; gap: 2px; }

  .tx-actions button {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    padding: 6px;
    border-radius: 8px;
    opacity: .55;
    transition: .2s;
  }
  .tx-actions button:hover { opacity: 1; background: #e5e7eb; }

  .empty {
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
    padding: 24px 0;
  }

  @media (max-width: 420px) {
    .tx-actions { flex-direction: column; gap: 0; }
    .card.balance strong { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>💰 Quản Lý Chi Tiêu</h1>
  </header>

  <!-- Tổng quan -->
  <section class="summary">
    <div class="card balance">
      <span>Số dư hiện tại</span>
      <strong id="balance">0 đ</strong>
    </div>
    <div class="card income">
      <span>↑ Thu nhập</span>
      <strong id="totalIncome">0 đ</strong>
    </div>
    <div class="card expense">
      <span>↓ Chi tiêu</span>
      <strong id="totalExpense">0 đ</strong>
    </div>
  </section>

  <!-- Form nhập -->
  <section class="form-card">
    <div class="type-toggle">
      <button type="button" data-type="expense" class="active">Chi tiêu</button>
      <button type="button" data-type="income">Thu nhập</button>
    </div>

    <form id="txForm">
      <input type="number" id="amount" placeholder="Số tiền (VD: 50000)" min="0" step="1000" required>

      <div class="row">
        <select id="category"></select>
        <input type="date" id="date" required>
      </div>

      <input type="text" id="note" placeholder="Ghi chú (tùy chọn)" maxlength="60">

      <button type="submit" class="btn-primary" id="submitBtn">Thêm giao dịch</button>
      <button type="button" class="btn-cancel hidden" id="cancelBtn">Hủy chỉnh sửa</button>
    </form>
  </section>

  <!-- Bộ lọc -->
  <section class="filter">
    <input type="month" id="filterMonth">
    <button type="button" id="clearFilter">Tất cả</button>
  </section>

  <!-- Thống kê -->
  <section class="panel">
    <h2>📊 Chi tiêu theo danh mục</h2>
    <div id="chart"></div>
  </section>

  <!-- Lịch sử -->
  <section class="panel">
    <h2>📋 Lịch sử giao dịch</h2>
    <ul id="txList"></ul>
  </section>
</div>

<script>
/* ============================================================
   DỮ LIỆU
   ============================================================ */
const STORAGE_KEY = 'expense_app_v1';

const CATEGORIES = {
  expense: [
    { id: 'food',      name: 'Ăn uống',   icon: '🍜' },
    { id: 'transport', name: 'Di chuyển', icon: '🚗' },
    { id: 'shopping',  name: 'Mua sắm',   icon: '🛍️' },
    { id: 'bill',      name: 'Hóa đơn',   icon: '🧾' },
    { id: 'entertain', name: 'Giải trí',  icon: '🎮' },
    { id: 'health',    name: 'Sức khỏe',  icon: '💊' },
    { id: 'education', name: 'Giáo dục',  icon: '📚' },
    { id: 'other_e',   name: 'Khác',      icon: '📦' }
  ],
  income: [
    { id: 'salary',    name: 'Lương',     icon: '💼' },
    { id: 'bonus',     name: 'Thưởng',    icon: '🎁' },
    { id: 'invest',    name: 'Đầu tư',    icon: '📈' },
    { id: 'other_i',   name: 'Khác',      icon: '💵' }
  ]
};

let state = {
  transactions: [],
  editingId: null
};

let currentType = 'expense';

/* ============================================================
   TIỆN ÍCH
   ============================================================ */
const $ = id => document.getElementById(id);

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function formatMoney(n) {
  return new Intl.NumberFormat('vi-VN').format(Math.round(n)) + ' đ';
}

function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function getCat(type, id) {
  return CATEGORIES[type].find(c => c.id === id)
      || { id, name: 'Khác', icon: '📦' };
}

/* ============================================================
   LƯU TRỮ
   ============================================================ */
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state.transactions = raw ? JSON.parse(raw) : [];
  } catch {
    state.transactions = [];
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.transactions));
}

/* ============================================================
   LỌC
   ============================================================ */
function getFiltered() {
  const month = $('filterMonth').value; // 'YYYY-MM' hoặc ''
  if (!month) return state.transactions;
  return state.transactions.filter(t => t.date.startsWith(month));
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  renderSummary();
  renderChart();
  renderList();
}

function renderSummary() {
  const txs = getFiltered();
  const income  = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

  $('totalIncome').textContent  = formatMoney(income);
  $('totalExpense').textContent = formatMoney(expense);
  $('balance').textContent      = formatMoney(income - expense);
}

function renderChart() {
  const chart = $('chart');
  const txs = getFiltered().filter(t => t.type === 'expense');
  const total = txs.reduce((s, t) => s + t.amount, 0);

  if (!total) {
    chart.innerHTML = '<p class="empty">Chưa có dữ liệu chi tiêu</p>';
    return;
  }

  const groups = {};
  txs.forEach(t => { groups[t.category] = (groups[t.category] || 0) + t.amount; });

  const sorted = Object.entries(groups).sort((a, b) => b[1] - a[1]);

  chart.innerHTML = sorted.map(([catId, amount]) => {
    const cat = getCat('expense', catId);
    const pct = (amount / total) * 100;
    return `
      <div class="bar-row">
        <div class="bar-label">
          <span>${cat.icon} ${cat.name}</span>
          <span>${formatMoney(amount)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%"></div>
        </div>
        <div class="bar-value">${pct.toFixed(1)}%</div>
      </div>`;
  }).join('');
}

function renderList() {
  const list = $('txList');
  const txs = getFiltered()
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

  if (!txs.length) {
    list.innerHTML = '<li class="empty">Chưa có giao dịch nào</li>';
    return;
  }

  list.innerHTML = txs.map(t => {
    const cat = getCat(t.type, t.category);
    const sign = t.type === 'income' ? '+' : '-';
    return `
      <li class="tx-item">
        <div class="tx-icon ${t.type}">${cat.icon}</div>
        <div class="tx-info">
          <div class="tx-name">${cat.name}</div>
          <div class="tx-meta">
            ${t.note ? escapeHtml(t.note) + ' • ' : ''}${formatDate(t.date)}
          </div>
        </div>
        <div class="tx-amount ${t.type}">${sign}${formatMoney(t.amount)}</div>
        <div class="tx-actions">
          <button type="button" title="Sửa" onclick="editTx('${t.id}')">✏️</button>
          <button type="button" title="Xóa" onclick="deleteTx('${t.id}')">🗑️</button>
        </div>
      </li>`;
  }).join('');
}

/* ============================================================
   DANH MỤC THEO LOẠI
   ============================================================ */
function renderCategoryOptions() {
  const sel = $('category');
  sel.innerHTML = CATEGORIES[currentType]
    .map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`)
    .join('');
}

document.querySelectorAll('.type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentType = btn.dataset.type;
    document.querySelectorAll('.type-toggle button')
      .forEach(b => b.classList.toggle('active', b === btn));
    renderCategoryOptions();
  });
});

/* ============================================================
   FORM
   ============================================================ */
function resetForm() {
  state.editingId = null;
  $('txForm').reset();
  $('date').value = new Date().toISOString().slice(0, 10);
  $('submitBtn').textContent = 'Thêm giao dịch';
  $('cancelBtn').classList.add('hidden');
  renderCategoryOptions();
}

$('txForm').addEventListener('submit', e => {
  e.preventDefault();

  const amount = Number($('amount').value);
  if (!amount || amount <= 0) {
    alert('Vui lòng nhập số tiền hợp lệ!');
    return;
  }

  const data = {
    type: currentType,
    amount,
    category: $('category').value,
    note: $('note').value.trim(),
    date: $('date').value
  };

  if (state.editingId) {
    const idx = state.transactions.findIndex(t => t.id === state.editingId);
    if (idx > -1) {
      state.transactions[idx] = {
        ...state.transactions[idx],
        ...data
      };
    }
  } else {
    state.transactions.push({
      id: uid(),
      createdAt: Date.now(),
      ...data
    });
  }

  save();
  resetForm();
  render();
});

$('cancelBtn').addEventListener('click', resetForm);

/* ============================================================
   SỬA / XÓA
   ============================================================ */
window.editTx = function (id) {
  const t = state.transactions.find(x => x.id === id);
  if (!t) return;

  state.editingId = id;
  currentType = t.type;

  document.querySelectorAll('.type-toggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.type === t.type)
  );

  renderCategoryOptions();
  $('amount').value   = t.amount;
  $('category').value = t.category;
  $('date').value     = t.date;
  $('note').value     = t.note;

  $('submitBtn').textContent = 'Cập nhật';
  $('cancelBtn').classList.remove('hidden');

  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.deleteTx = function (id) {
  const t = state.transactions.find(x => x.id === id);
  if (!t) return;

  const cat = getCat(t.type, t.category);
  if (!confirm(`Xóa giao dịch "${cat.name} - ${formatMoney(t.amount)}"?`)) return;

  state.transactions = state.transactions.filter(x => x.id !== id);

  if (state.editingId === id) resetForm();

  save();
  render();
};

/* ============================================================
   BỘ LỌC
   ============================================================ */
$('filterMonth').addEventListener('change', render);

$('clearFilter').addEventListener('click', () => {
  $('filterMonth').value = '';
  render();
});

/* ============================================================
   KHỞI ĐỘNG
   ============================================================ */
(function init() {
  load();
  resetForm();

  // Dữ liệu mẫu nếu là lần đầu sử dụng
  if (!state.transactions.length && !localStorage.getItem(STORAGE_KEY)) {
    const today = new Date().toISOString().slice(0, 10);
    state.transactions = [
      { id: uid(), type: 'income',  amount: 15000000, category: 'salary',    note: 'Lương tháng này', date: today, createdAt: Date.now() - 3000 },
      { id: uid(), type: 'expense', amount: 150000,   category: 'food',      note: 'Ăn trưa',         date: today, createdAt: Date.now() - 2000 },
      { id: uid(), type: 'expense', amount: 50000,    category: 'transport', note: 'Đổ xăng',         date: today, createdAt: Date.now() - 1000 }
    ];
    save();
  }

  render();
})();
</script>
</body>
</html>
